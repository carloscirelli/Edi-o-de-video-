  #fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; color: #fff; }

  .w { display: inline-block; white-space: pre; }

  .glow .acc { text-shadow: 0 0 30px rgba(77,124,255,0.75), 0 8px 26px rgba(0,0,0,0.45); }

  .pill svg { flex: none; }
  .dash { display: inline-flex; align-items: center; gap: 16px; padding: 12px 30px 16px; border: 3.5px dashed rgba(255,255,255,0.9); border-radius: 22px; background: rgba(255,255,255,0.12);

  .bar { display: inline-flex; align-items: center; gap: 22px; padding: 18px 30px; border-radius: 20px; background: rgba(13,18,32,0.94);

  .spk { position: absolute; width: 46px; height: 46px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.85)); }
  .cell { width: 150px; height: 150px; border-radius: 12px; background: #222; display: flex; align-items: center; justify-content: center;
